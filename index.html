<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>폐버스 생존기</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#eee}
  canvas{display:block;cursor:crosshair}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78)}
  #ov.hide{display:none}
  .panel{max-width:600px;margin:16px;padding:28px 34px;background:#17140e;border:2px solid #7a6324;border-radius:12px;text-align:center;box-shadow:0 0 60px rgba(232,183,48,.15)}
  h1{color:#e8b730;margin:0 0 6px;font-size:44px;letter-spacing:3px;text-shadow:0 3px 0 #5a3a10}
  .sub{color:#b9a88a;margin:0 0 18px;line-height:1.6}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;text-align:left;margin:0 auto 20px;width:max-content;font-size:14px}
  .keys b{color:#e8b730;font-family:Consolas,monospace}
  button{font:inherit;font-size:20px;font-weight:bold;padding:12px 40px;background:#e8b730;color:#1a1408;border:0;border-radius:8px;cursor:pointer}
  button:hover{background:#ffd04a}
  .stat{font-size:18px;margin:10px 0 20px;line-height:1.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div class="panel" id="panel"></div></div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dark=document.createElement('canvas'),dctx=dark.getContext('2d');
let VW=0,VH=0;
function resize(){VW=cv.width=innerWidth;VH=cv.height=innerHeight;dark.width=VW;dark.height=VH;}
addEventListener('resize',resize);resize();

const WORLD=2400,CYCLE=180,NIGHT_START=118,NIGHT_END=172;
const NEED={part:3,fuel:4,scrap:5},ENGINE_TIME=45;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1));
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const FONT='"Malgun Gothic","Apple SD Gothic Neo",sans-serif';

/* ---------- 사운드 ---------- */
let AC=null;
function beep(f,d,type='square',vol=.08,slide=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}
function noise(d,vol=.15,fq=1200){if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;
  const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}
const SFX={shoot(){noise(.18,.3,2500);beep(140,.12,'square',.05,-80)},swing(){noise(.08,.07,900)},hit(){noise(.1,.18,600);beep(90,.1,'sawtooth',.05,-40)},
  pick(){beep(880,.08,'triangle',.06,300)},hurt(){beep(160,.22,'sawtooth',.08,-90)},groan(){beep(rand(70,110),.7,'sawtooth',.03,-30)},
  bang(){noise(.15,.22,350)},empty(){beep(300,.05,'square',.04)},fix(){beep(520,.06,'square',.05);setTimeout(()=>beep(700,.08,'square',.05),70)},
  engine(){beep(55,.4,'sawtooth',.05,20)}};

/* ---------- 아이템 ---------- */
const ITEMS={food:{name:'통조림',icon:'🥫',col:'#d98c3a'},water:{name:'물',icon:'💧',col:'#4aa8e0'},med:{name:'구급상자',icon:'🩹',col:'#e04a5a'},
  ammo:{name:'탄약',icon:'🔫',col:'#c8b070'},scrap:{name:'고철',icon:'🔩',col:'#9aa0a6'},fuel:{name:'연료',icon:'⛽',col:'#d94a3a'},part:{name:'엔진부품',icon:'⚙️',col:'#e8c33a'}};
const LOOT=[['food',28],['water',28],['scrap',26],['ammo',16],['fuel',11],['med',6]];
function rollLoot(){let s=0;for(const l of LOOT)s+=l[1];let r=Math.random()*s;for(const l of LOOT){r-=l[1];if(r<=0)return l[0];}return 'food';}
const amountOf=k=>k==='ammo'?ri(3,6):1;

/* ---------- 좀비 종류 ---------- */
const ZT={walker:{hp:35,sp:52,dmg:9,r:13,col:'#5f7a4a',bus:3},runner:{hp:20,sp:112,dmg:6,r:11,col:'#8a9a5a',bus:2},brute:{hp:160,sp:38,dmg:24,r:21,col:'#45563a',bus:10}};

/* ---------- 상태 ---------- */
let state='menu',p,inv,bus,cars,trees,zombies,bullets,items,parts,blood,decals,msgs,t,day,kills,spawnT,engine,shake,flash,searchT,searchCar,warned,nightMsg,groanT;
const cam={x:0,y:0};
const K={},pressed=new Set(),mouse={x:0,y:0,wx:0,wy:0,l:false,r:false};

function newGame(){
  bus={x:WORLD/2-140,y:WORLD/2-50,w:280,h:100,hp:150,max:150,doorW:46};bus.doorX=bus.x+44;
  bus.rust=Array.from({length:14},()=>({x:rand(10,bus.w-20),y:rand(6,bus.h-10),r:rand(5,14)}));
  p={x:bus.x+bus.w/2,y:bus.y+bus.h/2,r:12,hp:100,food:85,water:80,stam:100,angle:0,atkCd:0,shootCd:0,swing:0,hurt:0,walk:0};
  inv={food:1,water:1,med:0,ammo:8,scrap:2,fuel:0,part:0};
  zombies=[];bullets=[];items=[];parts=[];blood=[];msgs=[];
  t=6;day=1;kills=0;spawnT=4;shake=0;flash=0;searchT=0;searchCar=null;warned=false;nightMsg=false;groanT=3;
  engine={on:false,t:0};
  genWorld();
  for(let i=0;i<22;i++)spawnGroundItem();
  msg('버려진 버스 안에서 눈을 떴다...','#e8b730');
  msg('부품을 모아 버스 엔진을 고치고 탈출하자!','#e8b730');
}

function genWorld(){
  cars=[];trees=[];decals=[];
  const bcx=WORLD/2,bcy=WORLD/2,cols=['#5a6470','#6e3b33','#3f5a4a','#7a6a50','#4a4a5a','#808080','#5b4636'];
  let tries=0;
  while(cars.length<36&&tries<3000){tries++;
    const hor=Math.random()<.5,w=hor?100:50,h=hor?50:100,x=rand(80,WORLD-80-w),y=rand(80,WORLD-80-h);
    if(dist(x+w/2,y+h/2,bcx,bcy)<330)continue;
    if(cars.some(c=>x<c.x+c.w+70&&x+w+70>c.x&&y<c.y+c.h+70&&y+h+70>c.y))continue;
    cars.push({x,y,w,h,hor,col:cols[ri(0,cols.length-1)],searched:false,part:false,rust:Array.from({length:4},()=>({x:rand(.15,.85),y:rand(.15,.85),r:rand(3,8)}))});
  }
  const far=cars.filter(c=>dist(c.x,c.y,bcx,bcy)>700).sort(()=>Math.random()-.5);
  const pool=far.length>=3?far:cars.slice().sort(()=>Math.random()-.5);
  for(let i=0;i<3;i++)pool[i].part=true;
  // 불타는 드럼통
  trees.push({x:bus.x-46,y:bus.y+bus.h+34,r:14,barrel:true});
  tries=0;
  while(trees.length<55&&tries<3000){tries++;
    const x=rand(60,WORLD-60),y=rand(60,WORLD-60),r=rand(12,20);
    if(dist(x,y,bcx,bcy)<260)continue;
    if(cars.some(c=>rectDist(x,y,c)<r+40))continue;
    if(trees.some(o=>dist(x,y,o.x,o.y)<o.r+r+50))continue;
    trees.push({x,y,r,br:Array.from({length:ri(4,7)},()=>({a:rand(0,6.28),l:rand(1.6,2.8)}))});
  }
  for(let i=0;i<700;i++){const k=Math.random();
    decals.push({x:rand(0,WORLD),y:rand(0,WORLD),r:rand(6,40),type:k<.55?'dirt':k<.85?'grass':'crack',c:k<.55?(Math.random()<.5?'rgba(0,0,0,.12)':'rgba(255,230,180,.05)'):'#4a4a2a',a:rand(0,6.28)});}
}

function rectDist(x,y,r){const cx=clamp(x,r.x,r.x+r.w),cy=clamp(y,r.y,r.y+r.h);return Math.hypot(x-cx,y-cy);}
function pushOut(o,rx,ry,rw,rh){
  const cx=clamp(o.x,rx,rx+rw),cy=clamp(o.y,ry,ry+rh);let dx=o.x-cx,dy=o.y-cy;const d2=dx*dx+dy*dy;
  if(d2>=o.r*o.r)return false;
  if(d2===0){const l=o.x-rx,r=rx+rw-o.x,tt=o.y-ry,b=ry+rh-o.y,m=Math.min(l,r,tt,b);
    if(m===l)o.x=rx-o.r;else if(m===r)o.x=rx+rw+o.r;else if(m===tt)o.y=ry-o.r;else o.y=ry+rh+o.r;return true;}
  const d=Math.sqrt(d2);o.x=cx+dx/d*o.r;o.y=cy+dy/d*o.r;return true;
}
function pushCircle(o,c){const dx=o.x-c.x,dy=o.y-c.y,d=Math.hypot(dx,dy),m=o.r+c.r;if(d<m&&d>0){o.x=c.x+dx/d*m;o.y=c.y+dy/d*m;}}
const inBus=o=>o.x>bus.x&&o.x<bus.x+bus.w&&o.y>bus.y&&o.y<bus.y+bus.h;
function busWalls(){const T=8,b=bus;return [[b.x,b.y,b.w,T],[b.x,b.y,T,b.h],[b.x+b.w-T,b.y,T,b.h],[b.x,b.y+b.h-T,b.doorX-b.x,T],[b.doorX+b.doorW,b.y+b.h-T,b.x+b.w-b.doorX-b.doorW,T]];}
function blockedPoint(x,y){if(x<0||y<0||x>WORLD||y>WORLD)return true;
  if(x>bus.x-20&&x<bus.x+bus.w+20&&y>bus.y-20&&y<bus.y+bus.h+20)return true;
  if(cars.some(c=>rectDist(x,y,c)<30))return true;if(trees.some(o=>dist(x,y,o.x,o.y)<o.r+20))return true;return false;}

function msg(text,col='#fff'){msgs.push({text,col,t:4.5});if(msgs.length>5)msgs.shift();}
function spawnGroundItem(){for(let i=0;i<30;i++){const x=rand(60,WORLD-60),y=rand(60,WORLD-60);if(blockedPoint(x,y))continue;
  const k=Math.random()<.12?'fuel':rollLoot();items.push({x,y,k,n:amountOf(k),bob:rand(0,6)});return;}}

/* ---------- 좀비 ---------- */
function pickType(){const r=Math.random();
  if(day>=4&&r<.06+day*.012)return 'brute';
  if((day>=2||engine.on)&&r<.25+day*.03)return 'runner';
  return 'walker';}
function spawnZombie(type,x,y){
  if(x===undefined){let ok=false;for(let i=0;i<30;i++){const a=rand(0,6.28),d=rand(560,860);x=p.x+Math.cos(a)*d;y=p.y+Math.sin(a)*d;
      if(x<30||y<30||x>WORLD-30||y>WORLD-30||blockedPoint(x,y))continue;ok=true;break;}if(!ok)return;}
  const z=ZT[type],sc=1+Math.max(0,day-1)*.08;
  zombies.push({type,x,y,r:z.r,hp:z.hp*sc,max:z.hp*sc,sp:z.sp*rand(.85,1.15),dmg:z.dmg,col:z.col,busDmg:z.bus,atk:0,kx:0,ky:0,hurt:0,ckT:.7,cx:x,cy:y,side:0,sideT:0,phase:rand(0,6)});
}
function damageZombie(z,d,ax,ay,kb){
  z.hp-=d;z.hurt=.15;z.kx+=ax*kb;z.ky+=ay*kb;
  for(let i=0;i<6;i++)parts.push({x:z.x,y:z.y,vx:ax*rand(40,160)+rand(-60,60),vy:ay*rand(40,160)+rand(-60,60),life:.5,max:.5,col:'#6a1a12',s:rand(2,4)});
  if(z.hp<=0){z.dead=true;kills++;blood.push({x:z.x,y:z.y,r:z.r*rand(1,1.6),a:rand(0,6)});if(blood.length>160)blood.shift();
    if(Math.random()<.28){const k=['food','water','ammo','scrap','ammo'][ri(0,4)];items.push({x:z.x,y:z.y,k,n:amountOf(k),bob:0});}}
}
function hurtPlayer(d){if(state!=='play')return;p.hp-=d;p.hurt=.35;shake=Math.max(shake,8);SFX.hurt();
  for(let i=0;i<8;i++)parts.push({x:p.x,y:p.y,vx:rand(-120,120),vy:rand(-120,120),life:.4,max:.4,col:'#a01818',s:rand(2,4)});}

/* ---------- 행동 ---------- */
function melee(){
  p.atkCd=.42;p.swing=.2;const weak=p.stam<8;p.stam=Math.max(0,p.stam-8);SFX.swing();let hit=false;
  for(const z of zombies){const d=dist(p.x,p.y,z.x,z.y);if(d>64+z.r)continue;
    let a=Math.atan2(z.y-p.y,z.x-p.x)-p.angle;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)>1.15)continue;
    damageZombie(z,weak?8:18,(z.x-p.x)/d,(z.y-p.y)/d,z.type==='brute'?80:260);hit=true;}
  if(hit){SFX.hit();shake=Math.max(shake,3);}
}
function shoot(){
  if(inv.ammo<=0){p.shootCd=.35;SFX.empty();if(!msgs.some(m=>m.text.startsWith('탄약')))msg('탄약이 없다! [C] 고철 2 → 탄약 6','#f88');return;}
  inv.ammo--;p.shootCd=.32;flash=.07;shake=Math.max(shake,4);SFX.shoot();
  const a=p.angle+rand(-.04,.04),c=Math.cos(a),s=Math.sin(a);
  bullets.push({x:p.x+c*18,y:p.y+s*18,vx:c*950,vy:s*950,life:.65});
}
function lootCar(c){
  c.searched=true;const got=[];
  if(c.part){c.part=false;inv.part++;got.push('⚙️ 엔진부품!');}
  const n=ri(1,2);for(let i=0;i<n;i++){const k=rollLoot(),a=amountOf(k);inv[k]+=a;got.push(ITEMS[k].icon+' '+ITEMS[k].name+(a>1?' x'+a:''));}
  if(Math.random()<.35&&!got.length)got.push('아무것도 없다');
  msg('수색: '+got.join(', '),got[0]&&got[0].includes('엔진')?'#ffd84a':'#cfe');SFX.pick();
  if(day>=2&&Math.random()<.12){spawnZombie('walker',c.x+c.w/2,c.y+c.h+18);msg('차 안에 숨어있던 좀비다!','#f66');SFX.groan();}
}
function useItem(k){
  if(k==='food'){if(inv.food<=0)return msg('통조림이 없다','#aaa');inv.food--;p.food=Math.min(100,p.food+40);p.hp=Math.min(100,p.hp+5);msg('통조림을 먹었다 (+배고픔)','#fc8');}
  if(k==='water'){if(inv.water<=0)return msg('물이 없다','#aaa');inv.water--;p.water=Math.min(100,p.water+45);msg('물을 마셨다 (+갈증)','#8cf');}
  if(k==='med'){if(inv.med<=0)return msg('구급상자가 없다','#aaa');if(p.hp>=100)return msg('체력이 가득하다','#aaa');inv.med--;p.hp=Math.min(100,p.hp+50);msg('치료했다 (+50)','#f88');}
  SFX.pick();
}
function nearBus(){return rectDist(p.x,p.y,bus)<70;}
const atDriver=()=>inBus(p)&&p.x<bus.x+80;
const canFixEngine=()=>inv.part>=NEED.part&&inv.fuel>=NEED.fuel&&inv.scrap>=NEED.scrap;

/* ---------- 업데이트 ---------- */
const isNight=()=>t>=NIGHT_START&&t<NIGHT_END;
function darkness(){if(t<NIGHT_START-15)return .06;if(t<NIGHT_START)return .06+(t-(NIGHT_START-15))/15*.82;if(t<NIGHT_END)return .88;return .88-(t-NIGHT_END)/(CYCLE-NIGHT_END)*.82;}

function newDay(){
  day++;warned=false;nightMsg=false;
  msg('☀ 아침이 밝았다 — '+day+'일차','#ffd84a');
  for(const c of cars)if(c.searched&&Math.random()<.35)c.searched=false;
  for(let i=0;i<7;i++)spawnGroundItem();
}

function update(dt){
  t+=dt;if(t>=CYCLE){t-=CYCLE;newDay();}
  if(!warned&&t>=NIGHT_START-15&&t<NIGHT_START){warned=true;msg('해가 지고 있다... 버스로 돌아가자!','#f0a040');}
  if(!nightMsg&&isNight()){nightMsg=true;msg('🌑 '+day+'일차 밤. 놈들이 몰려온다!','#ff5050');SFX.groan();}

  /* 플레이어 */
  let mx=0,my=0;if(K.KeyW||K.ArrowUp)my--;if(K.KeyS||K.ArrowDown)my++;if(K.KeyA||K.ArrowLeft)mx--;if(K.KeyD||K.ArrowRight)mx++;
  const len=Math.hypot(mx,my),sprint=(K.ShiftLeft||K.ShiftRight)&&len>0&&p.stam>1;
  const sp=150*(sprint?1.6:1)*(p.food<=0||p.water<=0?.75:1);
  if(len){p.x+=mx/len*sp*dt;p.y+=my/len*sp*dt;p.walk+=dt*sp*.06;}
  if(sprint)p.stam-=30*dt;else p.stam=Math.min(100,p.stam+(len?12:20)*dt);
  for(const c of cars)pushOut(p,c.x,c.y,c.w,c.h);
  for(const o of trees)pushCircle(p,o);
  for(const w of busWalls())pushOut(p,w[0],w[1],w[2],w[3]);
  p.x=clamp(p.x,p.r,WORLD-p.r);p.y=clamp(p.y,p.r,WORLD-p.r);
  p.angle=Math.atan2(mouse.wy-p.y,mouse.wx-p.x);
  p.food-=dt*.4*(sprint?1.5:1);p.water-=dt*.55*(sprint?1.5:1);p.food=Math.max(0,p.food);p.water=Math.max(0,p.water);
  if(p.food<=0||p.water<=0)p.hp-=dt*(p.food<=0&&p.water<=0?3:1.6);
  else if(p.food>50&&p.water>50&&p.hp<100)p.hp=Math.min(100,p.hp+dt*.6);
  p.atkCd-=dt;p.shootCd-=dt;p.swing=Math.max(0,p.swing-dt);p.hurt=Math.max(0,p.hurt-dt);
  if(mouse.l&&p.atkCd<=0)melee();
  if((mouse.r||K.Space)&&p.shootCd<=0)shoot();

  if(pressed.has('Digit1'))useItem('food');
  if(pressed.has('Digit2'))useItem('water');
  if(pressed.has('Digit3'))useItem('med');
  if(pressed.has('KeyC')){if(inv.scrap>=2){inv.scrap-=2;inv.ammo+=6;msg('탄약 6발 제작 (고철 -2)','#ec8');SFX.fix();}else msg('고철이 부족하다 (2개 필요)','#aaa');}
  if(pressed.has('KeyR')&&nearBus()){
    if(bus.hp>=bus.max)msg('바리케이드는 멀쩡하다','#aaa');
    else if(inv.scrap<1)msg('고철이 부족하다','#aaa');
    else{inv.scrap--;bus.hp=Math.min(bus.max,bus.hp+35);msg('바리케이드 수리 (+35)','#ec8');SFX.fix();}
  }
  // 엔진
  if(pressed.has('KeyE')&&atDriver()&&!engine.on){
    if(canFixEngine()){inv.part-=NEED.part;inv.fuel-=NEED.fuel;inv.scrap-=NEED.scrap;engine.on=true;engine.t=0;
      msg('엔진 수리 시작! '+ENGINE_TIME+'초만 버텨라!','#ffd84a');msg('엔진 소리에 놈들이 몰려온다!!','#ff5050');SFX.engine();}
    else msg('부족: '+['part','fuel','scrap'].filter(k=>inv[k]<NEED[k]).map(k=>ITEMS[k].name+' '+inv[k]+'/'+NEED[k]).join(', '),'#f99');
  }
  if(engine.on){engine.t+=dt;if(Math.random()<dt*2)SFX.engine();if(engine.t>=ENGINE_TIME){state='win';showEnd(true);return;}}
  // 수색
  searchCar=null;
  if(!atDriver()){let best=null,bd=1e9;for(const c of cars){if(c.searched)continue;const d=rectDist(p.x,p.y,c);if(d<p.r+24&&d<bd){bd=d;best=c;}}searchCar=best;}
  if(searchCar&&K.KeyE){searchT+=dt;if(searchT>=1.3){lootCar(searchCar);searchT=0;}}else searchT=0;
  // 줍기
  for(let i=items.length-1;i>=0;i--){const it=items[i];it.bob+=dt*3;if(dist(p.x,p.y,it.x,it.y)<p.r+14){inv[it.k]+=it.n;msg('+ '+ITEMS[it.k].icon+' '+ITEMS[it.k].name+(it.n>1?' x'+it.n:''),'#cfe');SFX.pick();items.splice(i,1);}}

  /* 스폰 */
  spawnT-=dt;const night=isNight();
  const cap=engine.on?36+day*2:night?8+day*4:2+day;
  const interval=engine.on?.45:night?Math.max(.45,2.4-day*.22):6;
  if(spawnT<=0){spawnT=interval;if(zombies.length<cap)spawnZombie(pickType());}
  if(!night&&!engine.on)for(const z of zombies)if(dist(z.x,z.y,p.x,p.y)>950)z.dead=true;

  /* 좀비 */
  const pin=inBus(p);
  groanT-=dt;if(groanT<=0){groanT=rand(2,6);if(zombies.some(z=>dist(z.x,z.y,p.x,p.y)<400))SFX.groan();}
  for(const z of zombies){
    z.hurt-=dt;z.atk-=dt;z.phase+=dt*z.sp*.08;
    const dx=p.x-z.x,dy=p.y-z.y,d=Math.hypot(dx,dy)||1;let ux=dx/d,uy=dy/d;
    z.ckT-=dt;if(z.ckT<=0){if(dist(z.x,z.y,z.cx,z.cy)<14&&d>50){z.side=Math.random()<.5?-1:1;z.sideT=1.3;}z.cx=z.x;z.cy=z.y;z.ckT=.7;}
    if(z.sideT>0){z.sideT-=dt;ux=ux*.3-uy*z.side;uy=uy*.3+(dx/d)*z.side;const l=Math.hypot(ux,uy)||1;ux/=l;uy/=l;}
    const w=Math.sin(z.phase*.5)*.25;const c=Math.cos(w),s=Math.sin(w);const vx=ux*c-uy*s,vy=ux*s+uy*c;
    const slow=z.hurt>0?.4:1;
    z.x+=(vx*z.sp*slow+z.kx)*dt;z.y+=(vy*z.sp*slow+z.ky)*dt;
    const decay=Math.pow(.004,dt);z.kx*=decay;z.ky*=decay;
    for(const c2 of cars)pushOut(z,c2.x,c2.y,c2.w,c2.h);
    for(const o of trees)pushCircle(z,o);
    if(bus.hp>0||!pin)pushOut(z,bus.x,bus.y,bus.w,bus.h);
    z.x=clamp(z.x,z.r,WORLD-z.r);z.y=clamp(z.y,z.r,WORLD-z.r);
    if(pin&&bus.hp>0){
      if(rectDist(z.x,z.y,bus)<z.r+5&&z.atk<=0){bus.hp=Math.max(0,bus.hp-z.busDmg);z.atk=1.4;SFX.bang();shake=Math.max(shake,2);
        for(let i=0;i<4;i++)parts.push({x:z.x+(ux)*z.r,y:z.y+(uy)*z.r,vx:rand(-80,80),vy:rand(-80,80),life:.3,max:.3,col:'#c9a227',s:2});
        if(bus.hp<=0){msg('바리케이드가 무너졌다! 놈들이 들어온다!','#ff4040');shake=14;}}
    }else if(d<z.r+p.r+5&&z.atk<=0){hurtPlayer(z.dmg);z.atk=1.0;}
  }
  for(let i=0;i<zombies.length;i++)for(let j=i+1;j<zombies.length;j++){const a=zombies[i],b=zombies[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d<m&&d>0){const o=(m-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;}}
  zombies=zombies.filter(z=>!z.dead);

  /* 총알 */
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(cars.some(c=>b.x>c.x&&b.x<c.x+c.w&&b.y>c.y&&b.y<c.y+c.h)||trees.some(o=>dist(b.x,b.y,o.x,o.y)<o.r)){b.life=0;
      for(let i=0;i<4;i++)parts.push({x:b.x,y:b.y,vx:rand(-100,100),vy:rand(-100,100),life:.2,max:.2,col:'#ffd',s:2});continue;}
    for(const z of zombies){if(!z.dead&&dist(b.x,b.y,z.x,z.y)<z.r+3){const l=Math.hypot(b.vx,b.vy);damageZombie(z,28,b.vx/l,b.vy/l,z.type==='brute'?60:180);b.life=0;SFX.hit();break;}}}
  bullets=bullets.filter(b=>b.life>0);zombies=zombies.filter(z=>!z.dead);

  /* 파티클 / 불 */
  const br=trees[0];if(Math.random()<dt*25)parts.push({x:br.x+rand(-6,6),y:br.y+rand(-6,6),vx:rand(-10,10),vy:rand(-50,-20),life:.6,max:.6,col:'fire',s:rand(3,6)});
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.life-=dt;}
  parts=parts.filter(q=>q.life>0);
  for(const m of msgs)m.t-=dt;msgs=msgs.filter(m=>m.t>0);
  shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt);

  if(p.hp<=0){p.hp=0;state='over';showEnd(false);}
}

    else{ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(d.a)*d.r,y+Math.sin(d.a)*d.r);ctx.lineTo(x+Math.cos(d.a+.6)*d.r*1.5,y+Math.sin(d.a+.6)*d.r*1.5);ctx.stroke();}}

function drawTree(o){

function drawZombie(z){
  if(!vis(z.x,z.y))return;const a=Math.atan2(p.y-z.y,p.x-z.x),wob=Math.sin(z.phase)*4;
  ctx.save();ctx.translate(z.x-cam.x,z.y-cam.y);ctx.rotate(a);

  ctx.strokeStyle=z.hurt>0?'#fff':'#3a4a2c';ctx.lineWidth=z.r*.42;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-z.r*.65);ctx.lineTo(z.r*1.35,-z.r*.55+wob);ctx.moveTo(0,z.r*.65);ctx.lineTo(z.r*1.35,z.r*.55-wob);ctx.stroke();
  ctx.fillStyle=z.hurt>0?'#e8e8e8':z.col;ctx.beginPath();ctx.arc(0,0,z.r,0,7);ctx.fill();
  ctx.fillStyle='rgba(60,20,20,.5)';ctx.beginPath();ctx.arc(-z.r*.3,z.r*.3,z.r*.35,0,7);ctx.fill();
  ctx.fillStyle=z.hurt>0?'#fff':'#7a8f62';ctx.beginPath();ctx.arc(z.r*.2,0,z.r*.58,0,7);ctx.fill();

function drawHUD(){

  const bw=270;ctx.fillStyle='#222';ctx.fillRect(22,70,bw,8);ctx.fillStyle=bus.hp>40?'#c9a227':'#d33';ctx.fillRect(22,70,bw*bus.hp/bus.max,8);
  ctx.fillStyle='#ddd';ctx.font='11px '+FONT;ctx.fillText('버스 바리케이드 '+Math.ceil(bus.hp)+'/'+bus.max,22,92);
  if(engine.on){ctx.fillStyle='#222';ctx.fillRect(22,100,bw,10);ctx.fillStyle='#4f4';ctx.fillRect(22,100,bw*engine.t/ENGINE_TIME,10);ctx.fillStyle='#fff';ctx.font='bold 11px '+FONT;ctx.fillText('엔진 수리 '+Math.floor(engine.t/ENGINE_TIME*100)+'%',26,124);}
  // 목표
  if(!engine.on){const o=['part','fuel','scrap'].map(k=>{const ok=inv[k]>=NEED[k];return ITEMS[k].name+' '+Math.min(inv[k],NEED[k])+'/'+NEED[k]+(ok?' ✔':'');});
    ctx.fillStyle='rgba(0,0,0,.55)';rrect(10,114,300,44,8);ctx.fill();ctx.font='bold 12px '+FONT;ctx.fillStyle=canFixEngine()?'#7f7':'#e8b730';
    ctx.fillText(canFixEngine()?'준비 완료! 운전석에서 [E] 로 엔진 수리':'탈출 목표 — 엔진 수리 재료',22,132);ctx.fillStyle='#ddd';ctx.font='12px '+FONT;ctx.fillText(o.join('  ·  '),22,150);}
  // 상태바
  const by=VH-110;ctx.fillStyle='rgba(0,0,0,.5)';rrect(10,by-12,232,108,8);ctx.fill();
  bar(20,by,212,16,p.hp,'#c33','❤ 체력');bar(20,by+22,212,16,p.food,'#d98c3a','🍖 배고픔');bar(20,by+44,212,16,p.water,'#3a8ad0','💧 갈증');bar(20,by+66,212,16,p.stam,'#6a6','⚡ 기력');
  // 인벤토리
  const keys={food:'1',water:'2',med:'3',ammo:'우클릭',scrap:'C/R'},order=['food','water','med','ammo','scrap','fuel','part'];
  const sw=62,sx=VW/2-order.length*sw/2,sy=VH-74;
  order.forEach((k,i)=>{const x=sx+i*sw;ctx.fillStyle='rgba(0,0,0,.6)';rrect(x+2,sy,sw-4,62,8);ctx.fill();ctx.strokeStyle=inv[k]>0?ITEMS[k].col:'#333';ctx.lineWidth=2;rrect(x+2,sy,sw-4,62,8);ctx.stroke();
    ctx.font='22px "Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.globalAlpha=inv[k]>0?1:.35;ctx.fillText(ITEMS[k].icon,x+sw/2,sy+30);ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.font='bold 13px '+FONT;ctx.fillText(inv[k],x+sw/2,sy+52);
    if(keys[k]){ctx.fillStyle='#e8b730';ctx.font='bold 10px '+FONT;ctx.fillText(keys[k],x+sw/2,sy-4);}ctx.textAlign='left';});
  // 상호작용 안내
  let hint='';
  if(atDriver()&&!engine.on)hint=canFixEngine()?'[E] 엔진 수리 시작':'[E] 엔진 확인 (재료 부족)';
  else if(searchCar)hint='[E] 꾹 눌러 차량 수색';
  else if(nearBus()&&bus.hp<bus.max)hint='[R] 바리케이드 수리 (고철 1)';
  if(hint){const[x,y]=S(p.x,p.y);ctx.font='bold 14px '+FONT;ctx.textAlign='center';const w=ctx.measureText(hint).width+20;
    ctx.fillStyle='rgba(0,0,0,.7)';rrect(x-w/2,y-52,w,24,6);ctx.fill();ctx.fillStyle='#ffe28a';ctx.fillText(hint,x,y-35);ctx.textAlign='left';
    if(searchT>0){ctx.fillStyle='#222';ctx.fillRect(x-40,y-24,80,6);ctx.fillStyle='#e8b730';ctx.fillRect(x-40,y-24,80*searchT/1.3,6);}}
  // 메시지
  ctx.textAlign='center';msgs.forEach((m,i)=>{ctx.globalAlpha=Math.min(1,m.t);ctx.font='bold 17px '+FONT;const w=ctx.measureText(m.text).width+24;
    ctx.fillStyle='rgba(0,0,0,.6)';rrect(VW/2-w/2,60+i*32,w,26,6);ctx.fill();ctx.fillStyle=m.col;ctx.fillText(m.text,VW/2,79+i*32);});ctx.globalAlpha=1;ctx.textAlign='left';
  // 미니맵
  const ms=160,mx=VW-ms-12,my=12,sc=ms/WORLD;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(mx-3,my-3,ms+6,ms+6);ctx.fillStyle='#2c2a21';ctx.fillRect(mx,my,ms,ms);
  ctx.fillStyle='#232326';ctx.fillRect(mx,my+(WORLD/2-110)*sc,ms,220*sc);ctx.fillRect(mx+WORLD*.28*sc,my,180*sc,ms);
  for(const c of cars){ctx.fillStyle=c.searched?'#444':'#8a8a8a';ctx.fillRect(mx+c.x*sc,my+c.y*sc,Math.max(2,c.w*sc),Math.max(2,c.h*sc));}
  ctx.fillStyle='#e8b730';ctx.fillRect(mx+bus.x*sc,my+bus.y*sc,bus.w*sc,bus.h*sc);
  ctx.fillStyle='#f33';for(const z of zombies)ctx.fillRect(mx+z.x*sc-1,my+z.y*sc-1,2.5,2.5);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx+p.x*sc,my+p.y*sc,3,0,7);ctx.fill();
  ctx.fillStyle='#aaa';ctx.font='11px '+FONT;ctx.textAlign='right';ctx.fillText('ESC 일시정지',VW-12,ms+32);ctx.textAlign='left';
  // 피격 / 저체력 비네트
  const v=Math.max(p.hurt*1.5,p.hp<30?(30-p.hp)/30*.6:0);
  if(v>0){const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.3,VW/2,VH/2,Math.max(VW,VH)*.7);g.addColorStop(0,'rgba(150,0,0,0)');g.addColorStop(1,`rgba(150,0,0,${Math.min(.7,v)})`);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);}
}

function render(){
  cam.x=p.x-VW/2+(Math.random()-.5)*shake;cam.y=p.y-VH/2+(Math.random()-.5)*shake;
  if(VW<WORLD)cam.x=clamp(cam.x,-40,WORLD-VW+40);if(VH<WORLD)cam.y=clamp(cam.y,-40,WORLD-VH+40);
  mouse.wx=mouse.x+cam.x;mouse.wy=mouse.y+cam.y;
  drawGround();
  for(const it of items)drawItem(it);
  for(const c of cars)drawCar(c);
  drawBus();
  for(const o of trees)drawTree(o);
  for(const z of zombies)drawZombie(z);
  drawPlayer();
  drawParticles();
  drawDark();
  if(darkness()>.4)drawEyes();
  drawHUD();
}

/* ---------- 루프 & 입력 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'){update(dt);}
  if(p)render();
  pressed.clear();
  requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!K[e.code])pressed.add(e.code);K[e.code]=true;
  if((e.code==='Escape'||e.code==='KeyP')&&(state==='play'||state==='pause')){state=state==='play'?'pause':'play';state==='pause'?showPause():hideOv();}});
addEventListener('keyup',e=>{K[e.code]=false;});
addEventListener('blur',()=>{for(const k in K)K[k]=false;mouse.l=mouse.r=false;});
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cv.addEventListener('mousedown',e=>{if(e.button===0)mouse.l=true;if(e.button===2)mouse.r=true;});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

const ov=document.getElementById('ov'),panel=document.getElementById('panel');
const KEYS=`<div class="keys">
<b>WASD</b><span>이동 (Shift: 달리기)</span><b>마우스 좌클릭</b><span>쇠파이프 휘두르기</span><b>우클릭 / Space</b><span>권총 사격 (탄약 소모)</span>
<b>E (꾹)</b><span>폐차 수색 · 운전석에서 엔진 수리</span><b>R</b><span>버스 근처에서 바리케이드 수리 (고철 1)</span><b>C</b><span>탄약 제작 (고철 2 → 탄약 6)</span>
<b>1 / 2 / 3</b><span>통조림 먹기 / 물 마시기 / 구급상자</span><b>ESC</b><span>일시정지</span></div>`;
function hideOv(){ov.classList.add('hide');}
function showMenu(){panel.innerHTML=`<h1>🚌 폐버스 생존기</h1><p class="sub">문명이 무너진 지 석 달. 당신의 은신처는 도로 위에 버려진 낡은 버스 한 대뿐.<br>
낮에는 폐차를 뒤져 식량과 물자를 모으고, <b style="color:#f66">밤에는 버스로 돌아가 버텨라.</b><br>
<b style="color:#e8b730">엔진부품 3개 · 연료 4통 · 고철 5개</b>를 모아 엔진을 고치면 탈출할 수 있다.</p>${KEYS}<button id="go">게임 시작</button>`;
  ov.classList.remove('hide');document.getElementById('go').onclick=start;}
function showPause(){panel.innerHTML=`<h1>일시정지</h1>${KEYS}<button id="go">계속하기</button>`;ov.classList.remove('hide');document.getElementById('go').onclick=()=>{state='play';hideOv();};}
function showEnd(win){
  panel.innerHTML=win?`<h1>🚌 탈출 성공!</h1><p class="sub">낡은 엔진이 굉음을 내며 깨어났다.<br>버스는 좀비 떼를 뚫고 지평선 너머로 사라졌다.</p>
    <div class="stat">생존 기간: <b>${day}일</b><br>처치한 좀비: <b>${kills}</b></div><button id="go">다시 하기</button>`
  :`<h1 style="color:#d33">사망</h1><p class="sub">${isNight()?'어둠 속에서 놈들에게 둘러싸였다...':'황무지에서 쓰러졌다...'}</p>
    <div class="stat">생존 기간: <b>${day}일</b><br>처치한 좀비: <b>${kills}</b><br>엔진부품: <b>${inv.part}/3</b></div><button id="go">다시 하기</button>`;
  ov.classList.remove('hide');document.getElementById('go').onclick=start;}
function start(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  newGame();state='play';hideOv();
}
newGame();showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
